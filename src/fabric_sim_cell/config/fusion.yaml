# Simulated cell: the example fusion settings, world frame = the plant world.
/**:
  ros__parameters:
    world_frame: world
    observation_topics:
    - /oarbot_blue/azure_kinect/fabric/gloves
    - /oarbot_silver/azure_kinect/fabric/gloves
    - /nuc/fabric/gloves
    glove_tag_ids:
    - 20
    - 21
    human_corner_uv:
    - 0.0
    - 1.0
    - 1.0
    - 1.0
    # Simulated cell: fusion judges camera liveness in wall-clock time (monotonic) against
    # max_age_sec, while stamps are sim time. The plant runs at ~0.23x real time, so the 5 Hz
    # overhead arrives every ~0.9 s of wall time and a 0.5 s window treats it as silent (never
    # waited for; its glove views then arrive 'late' and are dropped). 1.5 s covers it; perception
    # still drops captures older than 0.25 s of sim time before they get here.
    max_age_sec: 1.5
    max_wait_sec: 0.35
    sync_tolerance_sec: 0.015
    extrinsic_stddev_m: 0.01
    fusion_floor_m: 0.01
    view_spatial_gate_m: 0.15
    hand_max_speed_mps: 1.0
    jerk_stddev: 3.0
    filter_max_gap_sec: 0.5
