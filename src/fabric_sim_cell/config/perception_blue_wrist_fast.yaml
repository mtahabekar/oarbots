# Fast profile (launch profile:=fast): for the plant's half-resolution cameras (wrists 640x360,
# overhead 1024x768). No KLT tracker; 256 depth / 240 boundary samples (the estimator uses 64 / 24);
# pixel-area thresholds scaled by 1/4. Glove tags (~17 px) are searched in 2x upscaled glove regions, and
# rely on registered depth to resolve ambiguous poses and correct their range.
/**:
  ros__parameters:
    glove_tag_dictionary: DICT_4X4_50
    glove_tag_ids:
    - 20
    - 21
    glove_tag_size_m: 0.08
    glove_hsv_lower:
    - 35
    - 80
    - 60
    glove_hsv_upper:
    - 90
    - 255
    - 255
    tag_to_grip_offsets_m:
    - 0.0
    - -0.06
    - -0.0155
    - 0.0
    - -0.06
    - -0.0155
    tag_max_reprojection_px: 2.0
    tag_min_color_support: 0.08
    tag_pixel_stddev: 0.7
    tag_position_floor_m: 0.01
    glove_min_area_px: 25
    tag_roi_upscale: 2
    tag_use_depth: true
    workspace_roi:
    - 0.0
    - 0.0
    - 1.0
    - 1.0
    segmentation_backend: hsv
    segmentation_model: ''
    model_input_size:
    - 640
    - 384
    segmentation_confidence: 0.65
    cloth_max_value: 130
    cloth_max_saturation: 40
    min_component_area: 75
    uv_model: ''
    uv_confidence: 0.7
    uv_stddev: 0.05
    min_depth_m: 0.25
    max_depth_m: 3.0
    depth_edge_threshold_m: 0.03
    depth_noise_floor_m: 0.003
    depth_noise_scale: 0.002
    sample_stride: 8
    max_depth_samples: 256
    max_boundary_points: 240
    max_tracks: 0
    track_max_gap_sec: 0.2
    track_fb_threshold_px: 1.0
    sync_slop_sec: 0.015
    max_age_sec: 0.25
    require_robot_mask: false
    static_exclusion_mask: ''
    publish_debug_images: false
