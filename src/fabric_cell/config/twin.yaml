# Fabric twin configuration (plain structured YAML, one `config_file` parameter).
# EXAMPLE sheet, material and obstacle values: measure the real sheet and obstacle before use.
sheet:
  width_m: 0.84
  height_m: 0.84
  cells_x: 28            # 29 x 29 particles: the simulator's validated real-time ("lean") mesh
  cells_y: 28
  areal_density_kg_m2: 0.2
  stretch: [30000.0, 30000.0, 6000.0]   # Style3D weft, warp, shear; uncalibrated nominal values
  bend: [0.002, 0.001, 0.0005]
  patch_m: 0.03          # side of each grip patch: set to the measured finger contact size
  substeps: 8
  iterations: 6
  linear_iterations: 3
obstacle:                # a box in the world frame; the CBF uses its enclosing capsule
  center: [0.0, 0.0, 0.16]
  half_extents: [0.22, 0.22, 0.16]
  yaw: 0.0
feedback:
  stiffness_per_s2: 25.0
  damping_per_s: 6.0
  integral_per_s3: 150.0
  integral_limit_mps2: 5.0
  integral_leak_sec: 5.0
  accel_limit_mps2: 20.0
  trusted_sigma_m: 0.02
  max_error_m: 0.25
cbf:
  enabled: true
  config: ''             # empty: this package's config/cbf.json (7-cell prediction grid)
  period: 4              # twin frames per control update (15 Hz)
  max_speed_mps: 0.1     # what the arms deliver; never plan faster than that
  # Clearance kept from the obstacle's capsule: the 5 cm policy margin plus what the twin does
  # not know (its error against the real sheet, about 2 cm p95 in rehearsal, and speed x delay).
  margin_m: 0.08
runtime:
  world_frame: world
  robot_grip_frames: [oarbot_blue/fabric_grip, oarbot_silver/fabric_grip]
  hand_topic: /fabric/hand_states
  estimate_topic: /fabric/estimated_state
  # The twin runs this far behind the clock so grips are interpolated between measurements:
  # about one glove period plus the hand-fusion delay. Add max_speed * delay to the CBF margin.
  delay_sec: 0.15
  hand_coast_sec: 1.0
  hand_start_age_sec: 0.5
  estimate_stale_sec: 1.0
  state_every_frames: 4
  # Each robot grip keeps its starting offset from its human grip, shortened by this much, so
  # following lag changes the sag instead of stretching the sheet.
  formation_slack_m: 0.04
  formation_lateral_slack_m: 0.02   # each robot grip this much toward the other robot
  formation_gain_per_s: 2.0
  commands_enabled: false   # shadow mode: commands are computed and logged, zero is sent
warmup:
  insets_m: [0.02, 0.04]
  speed_mps: 0.03
  hold_sec: 5.0
  settle_sec: 3.0
