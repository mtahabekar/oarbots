# Tagged-glove hand fusion on the real cell. human_corner_uv: left hand (0,1), right hand (1,1).
# Hand names are sheet sides, not the person's hands: human_left holds corner (u, v) = (0, 1) on Blue's
# side (-x), next to Blue's corner (0, 0); a person facing the robots holds it with their RIGHT hand.
# glove_tag_ids lists [human_left, human_right]: tag 20 is worn on the hand on Blue's side
# (measured 2026-11-18, experiments/hardware/sessions/2026-11-18_glove_test).
/**:
  ros__parameters:
    world_frame: world
    observation_topics:
    - /oarbot_blue/azure_kinect/fabric/gloves
    - /oarbot_silver/azure_kinect/fabric/gloves
    - /nuc/fabric/gloves
    glove_tag_ids:
    - 20
    - 21
    human_corner_uv:
    - 0.0
    - 1.0
    - 1.0
    - 1.0
    max_age_sec: 0.5
    max_wait_sec: 0.35
    sync_tolerance_sec: 0.015
    extrinsic_stddev_m: 0.01
    fusion_floor_m: 0.01
    view_spatial_gate_m: 0.15
    hand_max_speed_mps: 1.0
    jerk_stddev: 3.0
    filter_max_gap_sec: 0.5
