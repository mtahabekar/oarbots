name: Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'patches/**', 'scripts/**', 'packages.repos', '.github/workflows/test.yaml']
  pull_request:
    paths: ['src/**', 'tests/**', 'patches/**', 'scripts/**', 'packages.repos', '.github/workflows/test.yaml']
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/rpirobotics/oarbot-jazzy-base-noble:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          apt-get install -y python3-venv python3-pytest python3-vcstool python3-rosdep
          source /opt/ros/jazzy/setup.bash
          vcs import src < packages.repos
          python3 scripts/apply_dependency_patches.py --workspace-src src
          rosdep update
          rosdep install --from-paths src --ignore-src --skip-keys python3-pyside6 -y
          python3 -m venv --system-site-packages /tmp/oarbots-venv
          /tmp/oarbots-venv/bin/pip install PySide6==6.8.3
      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Test platform
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          source /tmp/oarbots-venv/bin/activate
          colcon test --packages-select rokubi_force_torque_publisher force_torque_calibration oarbot_runtime tablet_gui human_hand_tracking fabric_perception fabric_state_estimator fabric_reference_reconstruction
          colcon test-result --verbose
          bash scripts/check_platform.sh
