# sim_eval observer ablation: the fast profile with no camera factors (max_depth 0, max_boundary 0,
# max_tracks 0). Every analysis then returns the prior unchanged: the same ensemble, driven by grips only.
# Fast profile (launch profile:=fast): real-time settings measured against the plant truth
# (oarbot_simulation logs, 2026-11-08): an 8 x 8 mesh with 16 members, no KLT tracks (they made
# the estimate worse), 24 boundary samples; ~20 ms per analysis instead of 153 ms, dense-grid
# error p50 2.1-2.5 mm / p95 4.6-5.6 mm against 1.9 / 7.2 mm for the full profile.
# All four corners are prescribed boundary conditions: robot grips from TF, human grips from the
# hand filter carried to the capture time with its own model (covariance grows with the age of
# the last glove detection). Camera evidence never moves a corner. hand_max_age_sec only limits
# how old a glove detection may be when an ensemble starts; a running one keeps a hand for
# hand_coast_sec (default 1 s) and then holds that grip in place instead of dropping the frame.
mesh:
  width_m: 0.84
  height_m: 0.84
  rows: 8
  columns: 8
  areal_density_kg_m2: 0.2
physics:
  backend: newton_style3d
  device: cuda:0
  max_step_sec: 0.004166666666666667
  gravity:
  - 0.0
  - 0.0
  - -9.81
  newton_stretch:
  - 30000.0
  - 30000.0
  - 6000.0
  newton_bend:
  - 0.002
  - 0.001
  - 0.0005
  iterations: 4
observer:
  # Relaxation to prior spread: half of the spread an analysis removes is put back. On the
  # replayed teleoperation clips this raised 95 % coverage from 0.68-0.85 to 0.81-0.92 at the
  # same surface error; 0.8-1.0 covered more but cost up to 15 mm of p95.
  relaxation: 0.5
  ensemble_size: 16
  localization_m: 0.3
  inflation: 1.02
  initial_sag_m: 0.03
  initial_position_std_m: 0.04
  initial_velocity_std_mps: 0.08
  residual_force_std_n: 0.05
  residual_force_walk_n_sqrt_sec: 0.01
  velocity_noise_mps_sqrt_sec: 0.02
  stale_after_sec: 0.5
  max_gap_sec: 0.5
  forecast_limit_sec: 0.6
  max_edge_strain: 0.4
  covariance_floor_m: 0.005
  seed: 7
observations:
  max_depth: 0
  max_boundary: 0
  max_tracks: 0
  association_gate_m: 0.15
  visibility_tolerance_m: 0.02
  pixel_stddev: 3.0
  depth_floor_m: 0.01
  max_surface_speed_mps: 1.0
  use_uv: false
runtime:
  world_frame: world
  observation_topics:
  - /oarbot_blue/azure_kinect/fabric/observations
  - /oarbot_silver/azure_kinect/fabric/observations
  - /nuc/fabric/observations
  hand_topic: /fabric/hand_states
  robot_grip_frames:
  - oarbot_blue/fabric_grip
  - oarbot_silver/fabric_grip
  robot_position_std_m: 0.005
  glove_extrinsic_std_m: 0.01
  hand_max_age_sec: 0.45
  # Simulated cell: camera liveness is judged in wall-clock time against this window, stamps in
  # sim time. At ~0.23x real time the 5 Hz overhead arrives every ~0.9 s of wall time; 0.75 s
  # treats it as silent, so its captures were not waited for. 1.5 s covers it.
  max_capture_age_sec: 1.5
  max_wait_sec: 0.4
  reorder_wait_sec: 0.02
  camera_sync_tolerance_sec: 0.015
  prediction_limit_sec: 0.2
  publish_rate_hz: 15.0
  forecast_rate_hz: 2.0
  forecast_horizons_sec:
  - 0.1
  - 0.2
  - 0.33
  use_forces: false
  force_topics:
  - /oarbot_blue/force_torque_calibrated
  - /oarbot_silver/force_torque_calibrated
  force_on_sheet_sign: -1.0
  force_stddev_n: 0.5
  force_max_age_sec: 0.1
reference:
  position_model_std_m: 0.02
  velocity_model_std_mps: 0.2
  initial_position_std_m: 0.2
  initial_velocity_std_mps: 0.3
  residual_force_std_n: 0.05
  residual_force_walk_n: 0.02
  huber_threshold: 3.0
  max_nfev: 50
  association_rounds: 2
  initial_sag_m: 0.08
