# Workspace profile for the stand-in sheet. The fixed overhead image settings come from
# 2026-11-18_sheet_capture/workspace_results.json. Wrist crops use the world-frame arm and
# hand envelope at capture time so moving the camera no longer changes the selected volume.
/nuc/fabric_perception:
  ros__parameters:
    workspace_roi: [0.48, 0.25, 0.80, 0.65]
    cloth_max_saturation: 60
    cloth_max_value: 90
    workspace_box_frame: world
    workspace_box_m: [-0.50, -0.50, 0.30, 0.50, 0.45, 1.20]
    workspace_depth_fill_px: 31
/oarbot_blue/azure_kinect/fabric_perception:
  ros__parameters:
    cloth_max_saturation: 70
    cloth_max_value: 150
    cloth_dark_value: 60
    workspace_box_frame: world
    workspace_box_m: [-0.90, -0.60, 0.25, 0.90, 1.20, 1.60]
    workspace_depth_fill_px: 31
/oarbot_silver/azure_kinect/fabric_perception:
  ros__parameters:
    cloth_max_saturation: 70
    cloth_max_value: 150
    cloth_dark_value: 60
    workspace_box_frame: world
    workspace_box_m: [-0.90, -0.60, 0.25, 0.90, 1.20, 1.60]
    workspace_depth_fill_px: 31
