# Tagged-glove hand fusion on the real cell. Hands are the person's own, facing the robots:
# glove_tag_ids and human_corner_uv list the left hand, then the right. The left hand (tag 21) holds
# corner (u, v) = (1, 1) on Silver's side, the right hand (tag 20) corner (0, 1) on Blue's side, next to
# Blue's corner (0, 0) (measured 2026-11-18, experiments/hardware/sessions/2026-11-18_glove_test).
/**:
  ros__parameters:
    world_frame: world
    observation_topics:
    - /oarbot_blue/azure_kinect/fabric/gloves
    - /nuc/fabric/gloves
    # Silver still publishes camera-local diagnostics. Its remounted wrist failed the
    # world-alignment check (2026-11-19); restore this topic after hand–eye validation.
    glove_tag_ids:
    - 21
    - 20
    human_corner_uv:
    - 1.0
    - 1.0
    - 0.0
    - 1.0
    max_age_sec: 0.5
    max_wait_sec: 0.35
    sync_tolerance_sec: 0.015
    extrinsic_stddev_m: 0.01
    fusion_floor_m: 0.01
    view_spatial_gate_m: 0.15
    hand_max_speed_mps: 1.0
    jerk_stddev: 3.0
    filter_max_gap_sec: 0.5
    # World box for hand measurements: in front of the robot grips (y > -0.35), above the floor and below
    # head height. S5 (2026-11-18) fused hands reached z -0.03 m with 95 cm single steps.
    hand_workspace_min: [-0.9, -0.35, 0.4]
    hand_workspace_max: [0.9, 1.2, 1.6]
    # World-frame correction from each glove's grip estimate to the real pinch (m): left hand xyz, then right hand
    # xyz, applied before fusion, so twin, estimator and stretch guard share it. Identified on 2026-11-21 from the
    # 11:11 warm-up with each corner fitted on its own (scripts/hw/grip_point_search.py, grip-apply): both pinches
    # 4.3 cm below the glove estimate, the right hand's also 2 cm toward Silver (+x). Replace by a measured
    # tag_to_grip_offsets_m (pivot calibration, test guide Block B) when that is done.
    world_grip_offset_m: [0.0, -0.0047, -0.0615, 0.026, -0.0012, -0.05]
