# Static calibration of the real cell, measured 2026-11-17/18 (lab log 2026-11-17, "World frame from the
# overhead camera"). `measured` stays false until the two fabric_grip transforms are measured (gate H15):
# the compute launch refuses placeholder calibrations.
#
# world: z up = the floor normal fitted to the overhead depth; y = the overhead image's left-to-right
# direction on the floor; x = y cross z (toward the overhead camera); origin chosen so the twin layout fits
# the open floor (definition: experiments/hardware/sessions/2026-11-17_world/overhead_world.json).
measured: false
world_frame: world
transforms:
# Overhead camera: world -> rgb_camera_link from the floor plane and the world convention, composed with
# the camera's factory camera_base -> depth -> rgb transforms (overhead_extrinsics.json). Measured.
- parent: world
  child: nuc/camera_base
  translation: [1.702, -0.6855, 2.5951]
  rotation_xyzw: [-0.408645, 0.008332, 0.912642, -0.004896]
# Parked bases: base_link from the roof markers (IDs 0, 4), 10 s mean of 51 overhead frames at 00:31,
# sd below 1.5 mm and 0.2 deg. x, y and yaw measured. z: tape measurement of each roof marker's top above
# the floor at its right and left edges (Blue 57.2 / 58.4 cm, Silver 58.3 / 58.5 cm, 2026-11-18), centre
# minus base_link -> marker mount (+0.572 m). Blue's marker plate is 1.2 cm lower on its right edge: the
# plate's mount only (base and arm level, checked by the user), so roll 0. A roll about the robot's
# forward axis leaves the heading (from the front-back edges) and the corner-mean centre unaffected to
# first order.
# Blue re-parked 2026-11-18 12:50 (it had been moved; lab log 2026-11-18, "Blue's position"). Its marker
# was then partly hidden by Silver's arm, so x, y, yaw come from park_guide's marker fit (10 s, 19 fits,
# sd 0.3 / 0.2 mm, 0.04 deg) corrected by the fit's offset on Blue's tilted plate, measured against the
# corners at 12:44 (fit - corners: x +5.4, y -0.2 mm, yaw -1.12 deg; 3 frames): fit (-0.4169, -1.0609,
# 89.16) -> (-0.4223, -1.0607, 90.28). z unchanged (tape).
- parent: world
  child: oarbot_blue/base_link
  translation: [-0.4223, -1.0607, 0.006]
  rotation_xyzw: [0.0, 0.0, 0.708853, 0.705356]
- parent: world
  child: oarbot_silver/base_link
  translation: [0.4165, -1.0708, 0.012]
  rotation_xyzw: [0.0, 0.0, 0.710554, 0.703643]
# IDENTIFIED, not measured (gate H15 still open): the pinch point in the tool frame, grip points identified experiments/hardware/sessions/2026-11-20_fabric_run/warmup_10_0.1_111137 25:49 (scripts/hw/grip_point_search.py).
- parent: oarbot_blue/j2n6s300_end_effector
  child: oarbot_blue/fabric_grip
  translation: [0.0021, 0.014, 0.001]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
- parent: oarbot_silver/j2n6s300_end_effector
  child: oarbot_silver/fabric_grip
  translation: [0.0121, 0.0048, 0.0065]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
