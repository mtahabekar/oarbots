# Tagged-glove hand fusion on the real cell. human_corner_uv: left hand (0,1), right hand (1,1).
/**:
  ros__parameters:
    world_frame: world
    observation_topics:
    - /oarbot_blue/azure_kinect/fabric/gloves
    - /oarbot_silver/azure_kinect/fabric/gloves
    - /nuc/fabric/gloves
    glove_tag_ids:
    - 20
    - 21
    human_corner_uv:
    - 0.0
    - 1.0
    - 1.0
    - 1.0
    max_age_sec: 0.5
    max_wait_sec: 0.35
    sync_tolerance_sec: 0.015
    extrinsic_stddev_m: 0.01
    fusion_floor_m: 0.01
    view_spatial_gate_m: 0.15
    hand_max_speed_mps: 1.0
    jerk_stddev: 3.0
    filter_max_gap_sec: 0.5
